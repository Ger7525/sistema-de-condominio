<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boletos - Administradora</title><link rel="stylesheet" href="../../css/estilo.css"></head>
<body><main class="container"><header class="card"><div class="toolbar"><div><h1>📄 Boletos</h1><p class="muted">Cadastro de boletos em PDF por apartamento</p></div><button class="btn-danger" onclick="sair()">Sair</button></div><nav class="actions"><a class="btn btn-secondary" href="painel.html">📊 Painel</a><a class="btn btn-secondary" href="reservas.html">📅 Reservas</a><a class="btn" href="boletos.html">📄 Boletos</a></nav></header><section class="card"><h2>Adicionar boleto</h2><div class="grid"><div><label>Apartamento</label><select id="aptBoleto"></select></div><div><label>Competência</label><input id="competencia" type="month"></div><div><label>Valor</label><input id="valor" type="number" step="0.01" min="0" placeholder="0,00"></div></div><div class="file-box" style="margin-top:16px"><label>Arquivo PDF</label><input id="arquivoBoleto" type="file" accept="application/pdf"><p id="nomeArquivo" class="muted"></p></div><div class="actions"><button onclick="adicionarBoleto()">📤 Salvar boleto</button></div><p class="readonly-note">Nesta versão frontend, os PDFs ficam armazenados no navegador via IndexedDB. A sincronização entre computadores será feita quando o backend for implantado.</p></section><section class="card"><h2>Boletos cadastrados</h2><div id="listaBoletos"></div></section></main><script src="../../js/dados_moradores.js"></script><script src="../../js/sistema.js"></script><script src="../../js/administradora/boletos.js"></script></body></html>
