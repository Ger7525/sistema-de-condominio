<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso - Edifício Laguna Hall</title><link rel="stylesheet" href="css/estilo.css"></head><body><main class="login-box"><div class="card hero"><div style="font-size:48px">🏢</div><h1>Edifício Laguna Hall</h1><p class="muted">Sistema Operacional do Condomínio</p></div><div class="card"><h2>🔐 Acesso ao Sistema</h2><label>Tipo de acesso</label><select id="tipoAcesso" onchange="alterarAcesso()"><option value="">Selecione o tipo de acesso</option><option value="portaria">Portaria</option><option value="morador">Morador</option></select><div id="areaPortaria" style="display:none;margin-top:16px"><label>Porteiro / Operador</label><select id="operador"><option value="">Selecione o porteiro</option></select><label style="margin-top:15px">Senha</label><input id="senhaPortaria" type="password" maxlength="3" autocomplete="off" placeholder="Digite a senha"><p class="muted" style="font-size:12px">Senha: primeira letra do nome do porteiro, repetida três vezes, em minúsculas.</p></div><div id="areaMorador" style="display:none;margin-top:16px"><label>Número do apartamento</label><select id="apt"></select><label style="margin-top:15px">Morador</label><select id="morador"><option value="">Selecione o morador</option></select><label style="margin-top:15px">Senha</label><input id="senhaMorador" type="password" autocomplete="off" placeholder="Digite o primeiro nome do morador"><p class="muted" style="font-size:12px">Senha: primeiro nome do morador selecionado, em minúsculas.</p></div><div class="actions"><button id="btnEntrar" onclick="entrar()" style="display:none">🔐 Entrar</button></div><p id="erro" class="error"></p></div></main><script src="js/dados_moradores.js"></script><script src="js/sistema.js"></script><script>const tipo=document.getElementById("tipoAcesso"),areaPortaria=document.getElementById("areaPortaria"),areaMorador=document.getElementById("areaMorador"),operador=document.getElementById("operador"),apt=document.getElementById("apt"),morador=document.getElementById("morador"),btnEntrar=document.getElementById("btnEntrar"),erroEl=document.getElementById("erro");document.addEventListener("DOMContentLoaded",()=>{OPERADORES_LAGUNA.forEach(nome=>operador.insertAdjacentHTML("beforeend",`<option value="${escapar(nome)}">${escapar(nome)}</option>`));preencherAptos(apt);});function alterarAcesso(){erroEl.textContent="";document.getElementById("senhaPortaria").value="";document.getElementById("senhaMorador").value="";areaPortaria.style.display=tipo.value==="portaria"?"block":"none";areaMorador.style.display=tipo.value==="morador"?"block":"none";btnEntrar.style.display=tipo.value?"inline-flex":"none";}apt.addEventListener("change",()=>{preencherMoradores(apt.value,morador);document.getElementById("senhaMorador").value="";});function senhaPorteiro(nome){return nome.trim().charAt(0).toLowerCase().repeat(3);}function primeiroNome(nome){return nome.trim().split(/\s+/)[0].toLowerCase();}function entrar(){erroEl.textContent="";if(tipo.value==="portaria"){const nome=operador.value,senha=document.getElementById("senhaPortaria").value;if(!nome||!senha)return erroEl.textContent="Selecione o porteiro e informe a senha.";if(senha!==senhaPorteiro(nome))return erroEl.textContent="Senha da portaria incorreta.";setSessao({tipo:"portaria",operador:nome,data:agoraISO()});location.href="pages/portaria_plantao.html";return;}if(tipo.value==="morador"){const apartamento=apt.value,indice=morador.value,pessoa=getMorador(apartamento,indice),senha=document.getElementById("senhaMorador").value.trim().toLowerCase();if(!apartamento||indice===""||!pessoa||!senha)return erroEl.textContent="Selecione o apartamento, o morador e informe a senha.";if(senha!==primeiroNome(pessoa.nome))return erroEl.textContent="Senha do morador incorreta.";setSessao({tipo:"morador",apt:apartamento,morador:pessoa.nome,telefone:pessoa.telefone,data:agoraISO()});location.href="pages/morador_portal.html";}}</script></body></html>
